# 避免 Supabase 免費專案因「長期無活動」被自動暫停（例如收到
# "scheduled to be paused in a couple of days" 通知）。
# 此 workflow 定期呼叫同一專案的 PostgREST，視為有使用紀錄。
#
# GitHub → 此 repo → Settings → Secrets and variables → Actions → New repository secret
#
# 必填其一組合：
#   SUPABASE_URL
#     例（你的 luluorder 專案 ref ortxxzozkndliywtejcw）：
#     https://ortxxzozkndliywtejcw.supabase.co
#     勿結尾斜線。
#   與下列擇一：
#     SUPABASE_ANON_KEY（Dashboard → Project Settings → API → anon public）
#     或 SUPABASE_SERVICE_ROLE_KEY（同上 service_role，建議此 workflow 用 service_role
#     可穩定讀到 foodlist；請勿洩漏、勿 commit）
#
# 手動測：Actions 分頁 → Supabase Keep Alive → Run workflow

name: Supabase Keep Alive

on:
  schedule:
    # 每天兩次 UTC（可依需要改頻率）
    - cron: "30 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read first foodlist row (REST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing SUPABASE_URL in repository secrets."
            exit 1
          fi
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            API_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
            KEY_KIND="service_role"
          elif [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            API_KEY="${SUPABASE_ANON_KEY}"
            KEY_KIND="anon"
          else
            echo "Missing SUPABASE_SERVICE_ROLE_KEY or SUPABASE_ANON_KEY in repository secrets."
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          url="${base}/rest/v1/foodlist?select=id,sort_order&limit=1&order=sort_order.asc"
          code=$(curl -sS -o /tmp/food_body -w "%{http_code}" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Accept: application/json" \
            "$url")
          echo "HTTP ${code} (using ${KEY_KIND})"
          cat /tmp/food_body
          echo
          if [ "$code" != "200" ]; then
            exit 1
          fi
          rows=$(jq -r 'if type == "array" then length else -1 end' /tmp/food_body)
          if [ "$rows" -lt 0 ]; then
            echo "Unexpected JSON (expected array)."
            exit 1
          fi
          if [ "$KEY_KIND" = "service_role" ] && [ "$rows" -eq 0 ]; then
            echo "Note: foodlist is empty (still counts as API activity for keep-alive)."
          fi
          if [ "$KEY_KIND" = "anon" ] && [ "$rows" -eq 0 ]; then
            echo "WARN: anon returned 0 rows (RLS often blocks table reads). Request still counts as activity; add SUPABASE_SERVICE_ROLE_KEY to verify data is readable."
          fi
