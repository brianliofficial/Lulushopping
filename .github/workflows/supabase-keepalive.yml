# 需在 GitHub → Settings → Secrets and variables → Actions 設定：
#   SUPABASE_URL（例：https://xxxxx.supabase.co，勿結尾斜線）
#   SUPABASE_ANON_KEY（Dashboard → API → anon public）
# 並在 Supabase 執行 supabase/migrations/004_rpc_ping.sql 建立 public.ping()

name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY in repository secrets."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/rpc/ping"
          code=$(curl -sS -o /tmp/ping_body -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -d "{}" \
            "$url")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            cat /tmp/ping_body
            exit 1
          fi
