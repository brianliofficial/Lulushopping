# 定期呼叫 Supabase REST API，讓 Postgres 有活動，降低免費專案長期閒置被暫停的機率。
# 需在 Repo → Settings → Secrets and variables → Actions 新增：
#   SUPABASE_URL          例：https://xxxxx.supabase.co（勿結尾斜線）
#   SUPABASE_SERVICE_ROLE_KEY  Dashboard → Project Settings → API → service_role

name: Supabase keep-alive

on:
  schedule:
    # 每天 02:00 UTC（可改成你方便的時段）
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query foodlist (service role, bypasses RLS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY in repository secrets."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/foodlist?select=id&limit=1"
          code=$(curl -sS -o /tmp/supabase_keepalive_body -w "%{http_code}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "$url")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "--- response body ---"
            cat /tmp/supabase_keepalive_body
            exit 1
          fi
          echo "OK"
